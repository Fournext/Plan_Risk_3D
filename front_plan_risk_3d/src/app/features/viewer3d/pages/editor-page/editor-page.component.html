<div
  class="bg-gradient-to-b from-[#447D9B] to-[#EEEFE0] text-white flex-1 flex flex-col rounded-[10px] h-100vh box-border">
  <canvas #canvas class="min-w-full rounded-[10px] min-h-[80vh] flex-1"></canvas>
</div>
<div class="flex gap-4 w-min-[100vw]  p-1 bg-gray-100 rounded-xl shadow-inner mt-1 justify-center ">
  <!-- Rotación -->
  <div>
    <label class="block font-medium mb-1">Rotación Y (radianes)</label>
    <input type="range" min="0" max="6.28" step="0.01" [value]="rotationY()"
      (input)="onRotationYChange($event.target.value)" class="w-full accent-blue-600" />
    <div class="text-sm text-gray-600">Valor: {{ rotationY() | number : '1.2-2' }}</div>
  </div>

 <div>

  </div>
-->


  <!-- Escala -->
  <div>
    <label class="block font-medium mb-1">Escala</label>
    <input type="range" min="0.1" max="3" step="0.1" [value]="scale()" (input)="onScaleChange($event.target.value)"
      class="w-full accent-green-600" />
    <div class="text-sm text-gray-600">Valor: {{ scale() | number : '1.1-1' }}</div>
  </div>

  <div>

  <!-- Posición X -->
  <div>
    <label class="block font-medium mb-1">Posición X (izquierda / derecha)</label>
    <input type="range" min="-20" max="10" step="0.1" [value]="posX()" (input)="onPosXChange($event.target.value)"
      class="w-full accent-purple-600" />
    <div class="text-sm text-gray-600">Valor: {{ posX() | number : '1.1-1' }}</div>
  </div>

  <!-- Posición Y -->
  <div>
    <label class="block font-medium mb-1">Posición Y (altura)</label>
    <input type="range" min="0" max="10" step="0.1" [value]="posY()" (input)="onPosYChange($event.target.value)"
      class="w-full accent-pink-600" />
    <div class="text-sm text-gray-600">Valor: {{ posY() | number : '1.1-1' }}</div>
  </div>
  <!-- Posición Z -->
  <div>
    <label class="block font-medium mb-1">Posición Z (profundidad)</label>
    <input type="range" min="-10" max="20" step="0.1" [value]="posZ()" (input)="onPosZChange($event.target.value)"
      class="w-full accent-yellow-600" />
    <div class="text-sm text-gray-600">Valor: {{ posZ() | number : '1.1-1' }}</div>
  </div>
    <!-- Selección de parte del modelo -->
    <div>
      <label class="block mb-1 font-semibold">Aplicar textura a:</label>
      <select [value]="selectedPart()" (change)="selectedPart.set($any($event.target).value)"
        class="w-full border border-slate-600 rounded-md px-2 py-1 focus:ring focus:ring-slate-400">
        <option value="">Elige tu parte</option>
        <option value="walls">Muros</option>
        <option value="door">Puertas</option>
        <option value="window">Ventanas</option>
      </select>
    </div>

    <!-- Selección de textura -->
    <div>
      <label class="block mb-1 font-semibold">Seleccionar textura:</label>
      <select [value]="selectedTexture()" (change)="onTextureChange($any($event.target).value)"
        class="w-full border border-slate-600 rounded-md px-2 py-1 focus:ring focus:ring-slate-400">
        @for (t of textures; track $index) {
        <option [value]="t.url">
          {{ t.name }}
        </option>
        }
      </select>
    </div>
    <!-- Vista previa de textura -->
    <div >
      <label for="texture-preview" class="font-semibold">Vista previa:</label>
      <img [src]="selectedTexture()" alt="Vista previa textura"
        class="w-full h-12 object-cover rounded-lg border border-slate-600" />
    </div>
  </div>
