<div class="relative animate-fade-in">
  <details class="inline-block absolute right-1 top-1" #dropdown>
    <summary
      class="flex items-center justify-between gap-2 bg-gray-800 text-white px-4 py-2 rounded-lg cursor-pointer select-none hover:bg-gray-700">
      Opciones
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z"
          clip-rule="evenodd" />
      </svg>
    </summary>

    <!-- MENU NORMAL (hacia abajo) -->
    <div
      class="absolute right-0 top-full mt-2 w-56 bg-white border border-gray-200 rounded-lg shadow-lg overflow-hidden z-50 animate-fade-in">
      <button (click)="onExportModel(dropdown)"
        class="flex gap-3 w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9.75v6.75m0 0-3-3m3 3 3-3m-8.25 6a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
        </svg>
        <span>Exportar modelo</span>
      </button>
      <button (click)="onSaveModel(dropdown)"
        class=" w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition flex gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
        </svg>
        <span>Guardar modelo</span></button>
      <button (click)="onUpdatePrices();dropdown.removeAttribute('open')"
        class="flex gap-3 w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>

        <span>Actualizar precios</span></button>
      <button (click)="onGenerateBudget();dropdown.removeAttribute('open')"
        class="flex gap-3 w-full text-left px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-gray-900 transition">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V13.5Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25V18Zm2.498-6.75h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V13.5Zm0 2.25h.007v.008h-.007v-.008Zm0 2.25h.007v.008h-.007V18Zm2.504-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5Zm0 2.25h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V18Zm2.498-6.75h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V13.5ZM8.25 6h7.5v2.25h-7.5V6ZM12 2.25c-1.892 0-3.758.11-5.593.322C5.307 2.7 4.5 3.65 4.5 4.757V19.5a2.25 2.25 0 0 0 2.25 2.25h10.5a2.25 2.25 0 0 0 2.25-2.25V4.757c0-1.108-.806-2.057-1.907-2.185A48.507 48.507 0 0 0 12 2.25Z" />
        </svg>

        <span>Generar presupuesto</span>
      </button>
    </div>
  </details>

  <div
    class="bg-gradient-to-b from-[#447D9B] to-[#EEEFE0] text-white flex-1 flex flex-col rounded-[10px] h-100vh box-border">
    <canvas #canvas class="min-w-full rounded-[10px] min-h-[80vh] flex-1"></canvas>
  </div>
  <div class="flex gap-4 w-min-[100vw]  p-1 bg-gray-100 rounded-xl shadow-inner mt-1 justify-center  ">
    <!-- Rotación -->
    @if(pricesForm() == true) {
    <app-prices-form [action]="onUpdatePrices" />
    }
    @if(budgetForm() == true) {
    <app-budget-form [action]="onShowBudget" />
    }
    <div>
      <label class="block font-medium mb-1">Rotación Y (radianes)</label>
      <input type="range" min="0" max="6.28" step="0.01" [value]="rotationY()"
        (input)="onRotationYChange($event.target.value)" class="w-full accent-blue-600" />
      <div class="text-sm text-gray-600">Valor: {{ rotationY() | number : '1.2-2' }}</div>
    </div>

    <!-- Escala -->
    @if(hasSelection()==true) {
    <div class="flex gap-4 p-2 bg-white rounded-lg shadow mt-1">
      <div>
        <label class="block text-sm font-medium mb-1 text-black">Largo</label>
        <input type="number" step="0.1" value="1" (input)="onScaleChange('x', $any($event.target).value)"
          class="w-20 border border-gray-400 rounded-md p-1 text-black" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-black">Ancho</label>
        <input type="number" step="0.1" value="1" (input)="onScaleChange('y', $any($event.target).value)"
          class="w-20 border border-gray-400 rounded-md p-1 text-black" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-black">Alto</label>
        <input type="number" step="0.1" value="1" (input)="onScaleChange('z', $any($event.target).value)"
          class="w-20 border border-gray-400 rounded-md p-1 text-black" />
      </div>
    </div>
    }

    <!-- 🔹 Dimensiones del objeto seleccionado -->
    @if (hasSelection()==true) {
    <div class="flex gap-4 p-2 bg-white rounded-lg shadow mt-1">
      <div>
        <label class="block text-sm font-medium mb-1 text-black">Ancho (X)</label>
        <input type="number" step="0.1" [value]="selectedWidth()"
          (input)="onDimensionChange('x', $any($event.target).value)"
          class="w-20 border border-gray-400 rounded-md p-1 text-black" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-black">Alto (Y)</label>
        <input type="number" step="0.1" [value]="selectedHeight()"
          (input)="onDimensionChange('y', $any($event.target).value)"
          class="w-20 border border-gray-400 rounded-md p-1 text-black" />
      </div>
    </div>

    }

    <div class="flex gap-4 p-2 bg-white rounded-lg shadow ">
      <!-- Posición X -->
      <div>
        <label class="block font-sm ">Posición X (izquierda / derecha)</label>
        <input type="range" min="-20" max="10" step="0.1" [value]="posX()" (input)="onPosXChange($event.target.value)"
          class="w-full accent-purple-600" />
        <div class="text-sm text-gray-600">Valor: {{ posX() | number : '1.1-1' }}</div>
      </div>

      <!-- Posición Y -->
      <div>
        <label class="block font-sm ">Posición Y (altura)</label>
        <input type="range" min="0" max="10" step="0.1" [value]="posY()" (input)="onPosYChange($event.target.value)"
          class="w-full accent-pink-600" />
        <div class="text-sm text-gray-600">Valor: {{ posY() | number : '1.1-1' }}</div>
      </div>
      <!-- Posición Z -->
      <div>
        <label class="block font-sm ">Posición Z (profundidad)</label>
        <input type="range" min="-10" max="20" step="0.1" [value]="posZ()" (input)="onPosZChange($event.target.value)"
          class="w-full accent-yellow-600" />
        <div class="text-sm text-gray-600">Valor: {{ posZ() | number : '1.1-1' }}</div>
      </div>
    </div>

    <div class="flex gap-4 p-2 bg-white rounded-lg shadow ">
      <!-- Selección de parte del modelo -->
      <div>
        <label class="block mb-1 font-semibold">Aplicar textura a:</label>
        <select [value]="selectedPart()" (change)="selectedPart.set($any($event.target).value)"
          class="w-full border border-slate-600 rounded-md px-2 py-1 focus:ring focus:ring-slate-400">
          <option value="">Elige tu parte</option>
          <option value="walls">Muros</option>
          <option value="door">Puertas</option>
          <option value="window">Ventanas</option>
        </select>
      </div>

      <!-- Selección de textura -->
      <div>
        <label class="block mb-1 font-semibold">Seleccionar textura:</label>
        <select [value]="selectedTexture()" (change)="onTextureChange($any($event.target).value)"
          class="w-full border border-slate-600 rounded-md px-2 py-1 focus:ring focus:ring-slate-400">
          @for (t of textures; track $index) {
          <option [value]="t.url">
            {{ t.name }}
          </option>
          }
        </select>
      </div>
      <!-- Vista previa de textura -->
      <div>
        <label for="texture-preview" class="font-semibold">Vista previa:</label>
        <img [src]="selectedTexture()" alt="Vista previa textura"
          class="w-full h-10 object-cover rounded-lg border border-slate-600" />
      </div>

    </div>


  </div>

</div>
